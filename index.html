<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MT GROUP ADMIN - إدارة الأسطول</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --accent-amber: #f59e0b;
            --accent-green: #10b981; --accent-red: #ef4444; --accent-indigo: #6366f1;
            --text-main: #f8fafc; --text-sub: #94a3b8; --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 30px; direction: rtl; }
        header { background-color: rgba(30, 41, 59, 0.95); border-bottom: 1px solid rgba(245, 158, 11, 0.3); padding: 12px 16px; position: sticky; top: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; }
        .logo-group { display: flex; align-items: center; gap: 10px; }
        .logo-icon { background-color: var(--accent-amber); color: #000; width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; }
        .header-title h1 { font-size: 14px; color: var(--accent-amber); font-weight: 800; }
        .header-title p { font-size: 9px; color: var(--text-sub); }
        .status-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); display: flex; align-items: center; gap: 4px; }
        main { max-width: 480px; margin: 0 auto; padding: 12px 16px; }
        
        #advanceNotificationsContainer { margin-bottom: 14px; }
        .adv-alert-card { background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(30, 41, 59, 0.95)); border: 1px solid var(--accent-red); border-radius: 14px; padding: 12px; margin-bottom: 8px; animation: pulseAlert 2s infinite; }
        @keyframes pulseAlert { 0% { border-color: rgba(239, 68, 68, 0.4); } 50% { border-color: rgba(239, 68, 68, 1); } 100% { border-color: rgba(239, 68, 68, 0.4); } }
        .adv-alert-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .adv-alert-title { font-size: 12px; font-weight: 800; color: var(--accent-red); display: flex; align-items: center; gap: 6px; }
        .adv-alert-amount { font-size: 13px; font-weight: 800; color: #fff; }
        .adv-actions { display: flex; gap: 8px; }
        .btn-approve { flex: 1; background-color: var(--accent-green); color: #000; border: none; padding: 8px; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; }
        .btn-reject { flex: 1; background-color: var(--accent-red); color: #fff; border: none; padding: 8px; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .stat-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 10px; text-align: center; }
        .stat-card p { font-size: 10px; color: var(--text-sub); margin-bottom: 2px; }
        .stat-card h3 { font-size: 18px; font-weight: 800; color: var(--accent-amber); }
        .tabs-nav { display: flex; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 3px; margin-bottom: 14px; }
        .tab-btn { flex: 1; padding: 10px 0; border: none; background: transparent; color: var(--text-sub); font-size: 12px; font-weight: 700; border-radius: 11px; cursor: pointer; }
        .tab-btn.active { background-color: var(--accent-amber); color: #000; }
        .section-tab { display: none; }
        .section-tab.active { display: block; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-title { font-size: 13px; font-weight: 800; color: var(--accent-amber); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; background-color: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 10px; font-size: 12px; outline: none; }
        .btn-submit { width: 100%; background-color: var(--accent-amber); color: #000; border: none; padding: 11px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; margin-top: 4px; }
        
        .drivers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .driver-subcard { background-color: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px; display: flex; justify-content: space-between; align-items: flex-start; }
        .driver-subcard p.label-day { color: var(--accent-amber); font-weight: 800; font-size: 10px; }
        .driver-subcard p.label-night { color: var(--accent-indigo); font-weight: 800; font-size: 10px; }
        .driver-subcard p.name { font-size: 11px; font-weight: 700; color: #fff; margin-top: 2px; }

        .fin-row { background-color: #0f172a; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .fin-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
        .fin-row-top .d-name { font-size: 12px; font-weight: 800; color: var(--accent-amber); }
        .fin-row-top .d-car { font-size: 10px; color: var(--text-sub); }
        
        .status-pill { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
        .status-on { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-off { background: rgba(148, 163, 184, 0.1); color: var(--text-sub); border: 1px solid var(--border-color); }

        .live-timer-badge { font-family: monospace; font-size: 10px; font-weight: 800; background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.4); padding: 2px 6px; border-radius: 6px; }
        .btn-end-shift { background-color: var(--accent-red); color: #fff; border: none; padding: 3px 6px; border-radius: 6px; font-weight: 800; font-size: 9px; cursor: pointer; margin-right: 4px; }

        .fin-stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 4px; text-align: center; margin-bottom: 8px; }
        .fin-box { background-color: rgba(30, 41, 59, 0.5); padding: 6px; border-radius: 8px; }
        .fin-box p.lbl { font-size: 8px; color: var(--text-sub); }
        .fin-box p.val { font-size: 10px; font-weight: 800; }
        .val-green { color: var(--accent-green); } .val-red { color: var(--accent-red); } .val-amber { color: var(--accent-amber); } .val-indigo { color: var(--accent-indigo); }
        
        .weekly-sched-container { background: rgba(30, 41, 59, 0.7); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
        .sched-title { font-size: 10px; font-weight: 800; color: var(--accent-amber); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .btn-edit-attendance { background: rgba(99, 102, 241, 0.2); border: 1px solid var(--accent-indigo); color: var(--accent-indigo); border-radius: 6px; padding: 2px 8px; font-size: 9px; font-weight: 700; cursor: pointer; }
        .sched-table { width: 100%; border-collapse: collapse; font-size: 9px; text-align: center; }
        .sched-table th { background: rgba(15, 23, 42, 0.8); color: var(--text-sub); padding: 5px; border: 1px solid var(--border-color); }
        .sched-table td { padding: 5px; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.4); }
        
        .admin-notes-box { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: 10px; max-height: 100px; overflow-y: auto; }
        .admin-note-item { padding: 4px; border-bottom: 1px solid rgba(51, 65, 85, 0.4); }

        .pay-salary-box { display: flex; justify-content: space-between; align-items: center; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 8px 10px; border-radius: 8px; }
        .btn-pay { background-color: var(--accent-green); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 10px; cursor: pointer; }
        .btn-pay.paid { background-color: var(--border-color); color: var(--text-sub); cursor: default; }

        .rate-config-box { display: flex; gap: 8px; align-items: center; margin-top: 6px; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.85); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background-color: var(--card-bg); border: 1px solid var(--accent-amber); border-radius: 20px; padding: 16px; width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-close { background: transparent; border: none; color: var(--text-sub); font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <div class="logo-icon">🚖</div>
            <div class="header-title">
                <h1>MT GROUP ADMIN</h1>
                <p>إدارة الأسطول والأجور الحية</p>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <span id="latencyBadge" class="status-badge">🌐 قياس...</span>
            <button onclick="openAddCarModal()" class="btn-submit" style="padding: 6px 12px; margin:0; width:auto;">+ سيارة</button>
        </div>
    </header>

    <main>
        <div id="advanceNotificationsContainer"></div>

        <div class="stats-grid">
            <div class="stat-card"><p>إجمالي السيارات</p><h3 id="totalCars">0</h3></div>
            <div class="stat-card"><p>إجمالي السائقين</p><h3 id="totalDrivers">0</h3></div>
        </div>

        <div class="tabs-nav">
            <button id="tabFleetBtn" onclick="switchTab('fleet')" class="tab-btn active">الأسطول</button>
            <button id="tabSalaryBtn" onclick="switchTab('salary')" class="tab-btn">الحسابات والعدادات</button>
        </div>

        <div id="tabFleet" class="section-tab active">
            <div id="carsList"></div>
        </div>

        <div id="tabSalary" class="section-tab">
            <div class="card" style="border-color: var(--accent-indigo);">
                <div class="card-header" style="margin-bottom: 6px;">
                    <span class="card-title" style="color: var(--accent-indigo);">⚙️ ضبط قيمة أجر الساعة الحالية</span>
                </div>
                <div class="rate-config-box">
                    <input type="number" id="hourlyRateInput" placeholder="أجر الساعة (ل.س)" class="form-control" style="margin-bottom:0;">
                    <button onclick="updateHourlyRate()" class="btn-submit" style="width: auto; padding: 10px 16px; margin: 0; background-color: var(--accent-indigo); color:#fff; white-space: nowrap;">حفظ وسعر جديد</button>
                </div>
            </div>

            <div class="card">
                <div class="form-group" style="margin-bottom:0;">
                    <label>أرشيف الأسابيع (من سبت إلى جمعة):</label>
                    <select id="weekSelector" onchange="changeWeekView()" class="form-control"></select>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><span class="card-title">⏱️ تعديل الرصيد / الساعات / السلف</span></div>
                <form onsubmit="adminAddTransaction(event)">
                    <div class="form-group">
                        <label>اختر السائق</label>
                        <select id="adminDriverSelect" required class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <label>نوع العملية</label>
                        <select id="adminActionType" class="form-control">
                            <option value="hours">إضافة ساعات عمل</option>
                            <option value="deduct_hours">خصم ساعات عمل</option>
                            <option value="reward">مكافئة مالية (ل.س)</option>
                            <option value="advance">سلفة مالية (ل.س)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>القيمة (ساعات أو مبلغ)</label>
                        <input type="number" id="adminAmount" min="0.5" step="0.5" required placeholder="مثال: 2 أو 25000" class="form-control">
                    </div>
                    <button type="submit" class="btn-submit">تنفيذ العملية</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">📊 مستحقات وعدادات الأسبوع للسائقين</span>
                    <button onclick="clearCurrentWeek()" style="background:transparent; border:1px solid var(--accent-amber); color:var(--accent-amber); border-radius:8px; padding:3px 8px; font-size:10px; cursor:pointer;">تصفية الأسبوع</button>
                </div>
                <!-- بطاقات السائقين المباشرة -->
                <div id="driversFinancialList"></div>
            </div>
        </div>
    </main>

    <!-- مودال إضافة / تعديل سيارة -->
    <div id="carModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle" style="font-weight:800; color:var(--accent-amber); font-size:13px;">إضافة سيارة</span>
                <button onclick="closeModal('carModal')" class="modal-close">✕</button>
            </div>
            <form onsubmit="saveCar(event)">
                <input type="hidden" id="carEditId">
                <div class="form-group"><label>رقم اللوحة</label><input type="text" id="carPlate" required class="form-control"></div>
                <div class="form-group"><label>موديل السيارة</label><input type="text" id="carModel" required class="form-control"></div>
                <hr style="border-color: var(--border-color); margin: 10px 0;">
                <div class="form-group"><label style="color:var(--accent-amber);">☀️ السائق النهاري</label><input type="text" id="dayDriverName" placeholder="الاسم" class="form-control" style="margin-bottom:4px;"><input type="tel" id="dayDriverPhone" placeholder="الهاتف" class="form-control"></div>
                <div class="form-group"><label style="color:var(--accent-indigo);">🌙 السائق الليلي</label><input type="text" id="nightDriverName" placeholder="الاسم" class="form-control" style="margin-bottom:4px;"><input type="tel" id="nightDriverPhone" placeholder="الهاتف" class="form-control"></div>
                <div class="form-group"><label style="color:var(--accent-green);">🔄 السائق الاحتياطي (المناوب)</label><input type="text" id="spareDriverName" placeholder="الاسم" class="form-control" style="margin-bottom:4px;"><input type="tel" id="spareDriverPhone" placeholder="الهاتف" class="form-control"></div>
                <button type="submit" class="btn-submit">حفظ</button>
            </form>
        </div>
    </div>

    <!-- مودال تعديل الحضور والغياب -->
    <div id="attendanceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span style="font-weight:800; color:var(--accent-indigo); font-size:13px;">✏️ تعديل الحضور والغياب</span>
                <button onclick="closeModal('attendanceModal')" class="modal-close">✕</button>
            </div>
            <form onsubmit="saveAttendanceChange(event)">
                <input type="hidden" id="attDriverName">
                <div class="form-group"><label>السائق:</label><input type="text" id="attDriverNameDisplay" readonly class="form-control" style="opacity:0.7;"></div>
                <div class="form-group"><label>اختر اليوم:</label><select id="attDateSelect" required class="form-control"></select></div>
                <div class="form-group"><label>الحالة:</label><select id="attStatusSelect" class="form-control"><option value="present">✅ حاضر</option><option value="absent">❌ غائب</option></select></div>
                <button type="submit" class="btn-submit" style="background-color:var(--accent-indigo); color:#fff;">تحديث الحالة</button>
            </form>
        </div>
    </div>

    <!-- مودال عرض صور العدادات مع وقت التقاطها -->
    <div id="imageModal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <div class="modal-header">
                <span id="modalImgTitle" style="font-weight:800; color:var(--accent-amber); font-size:13px;">صورة العداد</span>
                <button onclick="closeModal('imageModal')" class="modal-close">✕</button>
            </div>
            <p id="modalImgTime" style="font-size:11px; color:var(--accent-green); margin-bottom:6px; font-weight:bold;"></p>
            <img id="modalOdoImg" src="" alt="لا توجد صورة مسجلة" style="width:100%; border-radius:10px; margin-top:4px; max-height:65vh; object-fit:contain;">
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <p style="font-size:24px; margin-bottom:6px;">⚠️</p>
            <h4 id="deleteModalTitle" style="font-size:13px; font-weight:800; margin-bottom:4px;">تأكيد</h4>
            <p id="deleteModalDesc" style="font-size:11px; color:var(--text-sub); margin-bottom:14px;"></p>
            <div style="display:flex; gap:8px;">
                <button id="btnConfirmDelete" class="btn-submit" style="background-color:var(--accent-red); color:#fff; flex:1;">حذف</button>
                <button onclick="closeModal('deleteModal')" class="btn-submit" style="background-color:var(--border-color); color:#fff; flex:1;">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBXmCRvDy30zwtI904kG_4VL9cPeSpUYJA",
            authDomain: "mt-taxi-b608f.firebaseapp.com",
            projectId: "mt-taxi-b608f",
            storageBucket: "mt-taxi-b608f.firebasestorage.app",
            messagingSenderId: "757032602654",
            appId: "1:757032602654:web:715ba83f30367de5e0720f",
            databaseURL: "https://mt-taxi-b608f-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let HOURLY_RATE = 8500;

        db.ref('settings/hourlyRate').on('value', (snapshot) => {
            if (snapshot.exists()) HOURLY_RATE = Number(snapshot.val()) || 8500;
            const rateInput = document.getElementById('hourlyRateInput');
            if (rateInput) rateInput.value = HOURLY_RATE;
            renderWeeklyFinancialList();
        });

        function updateHourlyRate() {
            const newRate = Number(document.getElementById('hourlyRateInput').value);
            if (!newRate || newRate <= 0) { alert("أجر غير صحيح."); return; }
            db.ref('settings/hourlyRate').set(newRate).then(() => alert(`✅ تم التحديث (${newRate.toLocaleString()} ل.س)`));
        }

        function formatTime(timestamp) {
            if (!timestamp) return '--:--';
            return new Date(timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function formatDateTime(timestamp) {
            if (!timestamp) return 'غير متوفر';
            return new Date(timestamp).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'medium' });
        }

        function getSaturdayWeekId(dateObj = new Date()) {
            const d = new Date(dateObj);
            const day = d.getDay();
            let diff = (day >= 6) ? (day - 6) : (day + 1);
            d.setDate(d.getDate() - diff);
            return `${d.getFullYear()}-W_Sat_${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function getWeekDaysList(weekId) {
            const parts = weekId.split('-W_Sat_');
            const satDate = new Date(parts[0], parts[1].split('-')[0] - 1, parts[1].split('-')[1]);
            const dayNames = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
            const daysArr = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(satDate);
                d.setDate(satDate.getDate() + i);
                daysArr.push({ name: dayNames[i], dateKey: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` });
            }
            return daysArr;
        }

        window.currentActiveWeek = getSaturdayWeekId();
        window.appState = { cars: [], weeklyRecords: {}, activeShifts: {}, pendingAdvances: {}, driverNotes: {} };

        db.ref('cars').on('value', (snapshot) => {
            window.appState.cars = snapshot.val() ? Object.values(snapshot.val()) : [];
            renderApp();
        });

        db.ref('weeklyRecords').on('value', (snapshot) => {
            window.appState.weeklyRecords = snapshot.val() || {};
            renderWeeklyFinancialList();
        });

        db.ref('notes').on('value', (snapshot) => {
            window.appState.driverNotes = snapshot.val() || {};
            renderWeeklyFinancialList();
        });

        db.ref('activeShifts').on('value', (snapshot) => {
            window.appState.activeShifts = snapshot.val() || {};
            renderWeeklyFinancialList();
        });

        // دالة فتح مودال الصور مع عرض وقت التقاطها بدقة
        window.openOdometerImage = function(driverName, type) {
            const weekId = window.currentActiveWeek;
            const rec = window.appState.weeklyRecords[weekId] && window.appState.weeklyRecords[weekId][driverName];
            const imgBase64 = type === 'start' ? rec?.odoStartImg : rec?.odoEndImg;
            const imgTime = type === 'start' ? rec?.odoStartTimestamp : rec?.odoEndTimestamp;

            document.getElementById('modalImgTitle').innerText = type === 'start' ? `صورة عداد البداية (${driverName})` : `صورة عداد النهاية (${driverName})`;
            document.getElementById('modalImgTime').innerText = `🕒 وقت التقاط الصورة: ${formatDateTime(imgTime)}`;
            
            const imgEl = document.getElementById('modalOdoImg');
            if (imgBase64) {
                imgEl.src = imgBase64;
                openModal('imageModal');
            } else {
                alert("⚠️ لم يتم رفع صورة لهذه الوردية بعد.");
            }
        };

        window.swapWithSpareDriver = function(carId, shiftType) {
            const car = window.appState.cars.find(c => c.id === carId);
            if (!car) return;
            const spare = car.spareDriver;
            if (!spare || !spare.name) { alert("⚠️ لا يوجد سائق احتياطي مسجل."); return; }
            let targetName = shiftType === 'day' ? car.dayDriver?.name : car.nightDriver?.name;
            let targetPhone = shiftType === 'day' ? car.dayDriver?.phone : car.nightDriver?.phone;
            if (confirm(`تبديل السائق بالاحتياطي (${spare.name})؟`)) {
                if (shiftType === 'day') car.dayDriver = { name: spare.name, phone: spare.phone };
                else car.nightDriver = { name: spare.name, phone: spare.phone };
                car.spareDriver = { name: targetName || "", phone: targetPhone || "" };
                db.ref('cars').set(window.appState.cars).then(() => alert("✅ تم بنجاح!"));
            }
        };

        window.sendAdminReply = function(driverName) {
            const inputEl = document.getElementById(`reply_input_${driverName.replace(/\s+/g, '_')}`);
            if (!inputEl) return;
            const text = inputEl.value.trim();
            if (!text) return;
            db.ref(`notes/${driverName}`).push({ sender: 'الإدارة', text: text, timestamp: Date.now() }).then(() => {
                inputEl.value = "";
                alert("✅ تم إرسال الرد.");
            });
        };

        window.openAttendanceModal = function(driverName) {
            document.getElementById('attDriverName').value = driverName;
            document.getElementById('attDriverNameDisplay').value = driverName;
            const weekDays = getWeekDaysList(window.currentActiveWeek);
            document.getElementById('attDateSelect').innerHTML = weekDays.map(d => `<option value="${d.dateKey}">${d.name} (${d.dateKey})</option>`).join('');
            openModal('attendanceModal');
        };

        window.saveAttendanceChange = function(e) {
            e.preventDefault();
            const driverName = document.getElementById('attDriverName').value;
            const dateKey = document.getElementById('attDateSelect').value;
            const status = document.getElementById('attStatusSelect').value;
            const weekId = window.currentActiveWeek;
            db.ref().update({[`weeklyRecords/${weekId}/${driverName}/days/${dateKey}/status`]: status}).then(() => {
                alert("✅ تم التحديث!");
                closeModal('attendanceModal');
            });
        };

        window.adminEndShift = function(carId, driverName) {
            if (confirm(`إنهاء وردية السائق (${driverName})؟`)) {
                const weekId = getSaturdayWeekId();
                const shiftData = window.appState.activeShifts[carId];
                const endTime = Date.now();
                let elapsedHours = shiftData ? Math.max(0, (endTime - shiftData.timestamp) / 1000) / 3600 : 0;
                
                if (!window.appState.weeklyRecords[weekId]) window.appState.weeklyRecords[weekId] = {};
                if (!window.appState.weeklyRecords[weekId][driverName]) window.appState.weeklyRecords[weekId][driverName] = { hours: 0, advances: 0, rewards: 0 };
                const rec = window.appState.weeklyRecords[weekId][driverName];
                rec.hours = (rec.hours || 0) + elapsedHours;

                const updates = {};
                updates[`activeShifts/${carId}`] = null;
                updates[`weeklyRecords/${weekId}/${driverName}`] = rec;
                db.ref().update(updates).then(() => alert("✅ تم إنهاء الوردية."));
            }
        };

        window.paySalary = function(driverName, amount) {
            if (amount <= 0) { alert("لا توجد مستحقات."); return; }
            if (confirm(`تقبيض السائق (${driverName}) مبلغ ${amount.toLocaleString()} ل.س؟`)) {
                const weekId = window.currentActiveWeek;
                db.ref(`weeklyRecords/${weekId}/${driverName}/paid`).set(true);
                db.ref(`weeklyRecords/${weekId}/${driverName}/paidAmount`).set(amount);
                alert("✅ تم تسجيل دفع الراتب!");
            }
        };

        function getAllDrivers() {
            let drivers = [];
            window.appState.cars.forEach(c => {
                if (c.dayDriver?.name?.trim()) drivers.push({ name: c.dayDriver.name, car: c.plate, shift: 'نهاري', carId: c.id });
                if (c.nightDriver?.name?.trim()) drivers.push({ name: c.nightDriver.name, car: c.plate, shift: 'ليلي', carId: c.id });
            });
            return drivers;
        }

        function renderApp() {
            document.getElementById('totalCars').innerText = window.appState.cars.length;
            document.getElementById('totalDrivers').innerText = getAllDrivers().length;
            renderFleet();
            renderAdminDriverOptions();
            renderWeekSelector();
            renderWeeklyFinancialList();
        }

        function renderFleet() {
            const container = document.getElementById('carsList');
            if (!container) return;
            if (window.appState.cars.length === 0) { container.innerHTML = `<div class="card" style="text-align:center; color:var(--text-sub); font-size:11px;">لا توجد سيارات.</div>`; return; }
            container.innerHTML = window.appState.cars.map(car => `
                <div class="card">
                    <div class="card-header">
                        <div><span style="background:rgba(245,158,11,0.2); color:var(--accent-amber); font-weight:800; font-size:10px; padding:2px 6px; border-radius:6px;">${car.plate}</span><h3 style="font-size:13px; font-weight:800; margin-top:4px;">${car.model}</h3></div>
                        <div><button onclick="editCar(${car.id})" style="background:transparent; border:none; color:var(--text-sub); cursor:pointer;">✏️</button><button onclick="askDeleteCar(${car.id})" style="background:transparent; border:none; color:var(--accent-red); cursor:pointer; margin-right:6px;">🗑️</button></div>
                    </div>
                    <div class="drivers-grid">
                        <div class="driver-subcard">
                            <div><p class="label-day">☀️ نهاري</p><p class="name">${car.dayDriver?.name || 'شاغر'}</p></div>
                            ${car.spareDriver?.name ? `<button onclick="swapWithSpareDriver(${car.id}, 'day')" style="background:rgba(16,185,129,0.2); border:1px solid var(--accent-green); color:var(--accent-green); border-radius:4px; font-size:9px; padding:2px 5px; cursor:pointer;">🔄 تبديل</button>` : ''}
                        </div>
                        <div class="driver-subcard">
                            <div><p class="label-night">🌙 ليلي</p><p class="name">${car.nightDriver?.name || 'شاغر'}</p></div>
                            ${car.spareDriver?.name ? `<button onclick="swapWithSpareDriver(${car.id}, 'night')" style="background:rgba(16,185,129,0.2); border:1px solid var(--accent-green); color:var(--accent-green); border-radius:4px; font-size:9px; padding:2px 5px; cursor:pointer;">🔄 تبديل</button>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.openAddCarModal = function() {
            document.getElementById('carEditId').value = "";
            document.getElementById('carPlate').value = "";
            document.getElementById('carModel').value = "";
            document.getElementById('dayDriverName').value = "";
            document.getElementById('dayDriverPhone').value = "";
            document.getElementById('nightDriverName').value = "";
            document.getElementById('nightDriverPhone').value = "";
            document.getElementById('spareDriverName').value = "";
            document.getElementById('spareDriverPhone').value = "";
            openModal('carModal');
        };

        window.editCar = function(carId) {
            const car = window.appState.cars.find(c => c.id === carId);
            if (!car) return;
            document.getElementById('carEditId').value = car.id;
            document.getElementById('carPlate').value = car.plate;
            document.getElementById('carModel').value = car.model;
            document.getElementById('dayDriverName').value = car.dayDriver?.name || "";
            document.getElementById('dayDriverPhone').value = car.dayDriver?.phone || "";
            document.getElementById('nightDriverName').value = car.nightDriver?.name || "";
            document.getElementById('nightDriverPhone').value = car.nightDriver?.phone || "";
            document.getElementById('spareDriverName').value = car.spareDriver?.name || "";
            document.getElementById('spareDriverPhone').value = car.spareDriver?.phone || "";
            openModal('carModal');
        };

        window.saveCar = function(e) {
            e.preventDefault();
            const editId = document.getElementById('carEditId').value;
            const carData = {
                id: editId ? Number(editId) : Date.now(),
                plate: document.getElementById('carPlate').value.trim(),
                model: document.getElementById('carModel').value.trim(),
                dayDriver: { name: document.getElementById('dayDriverName').value.trim(), phone: document.getElementById('dayDriverPhone').value.trim() },
                nightDriver: { name: document.getElementById('nightDriverName').value.trim(), phone: document.getElementById('nightDriverPhone').value.trim() },
                spareDriver: { name: document.getElementById('spareDriverName').value.trim(), phone: document.getElementById('spareDriverPhone').value.trim() }
            };
            if (editId) {
                const idx = window.appState.cars.findIndex(c => c.id == editId);
                if (idx !== -1) window.appState.cars[idx] = carData;
            } else {
                window.appState.cars.push(carData);
            }
            closeModal('carModal');
            db.ref('cars').set(window.appState.cars);
        };

        window.askDeleteCar = function(carId) {
            document.getElementById('deleteModalTitle').innerText = "حذف السيارة";
            document.getElementById('deleteModalDesc').innerText = "هل أنت متأكد من الحذف؟";
            window.pendingDeleteAction = () => {
                window.appState.cars = window.appState.cars.filter(c => c.id !== carId);
                db.ref('cars').set(window.appState.cars);
            };
            openModal('deleteModal');
        };

        document.getElementById('btnConfirmDelete')?.addEventListener('click', () => {
            if (window.pendingDeleteAction) window.pendingDeleteAction();
            closeModal('deleteModal');
        });

        function renderAdminDriverOptions() {
            const select = document.getElementById('adminDriverSelect');
            if (!select) return;
            select.innerHTML = `<option value="">اختر السائق...</option>` + getAllDrivers().map(d => `<option value="${d.name}">${d.name} (${d.car})</option>`).join('');
        }

        window.adminAddTransaction = function(e) {
            e.preventDefault();
            const driverName = document.getElementById('adminDriverSelect').value;
            const actionType = document.getElementById('adminActionType').value;
            const amount = Number(document.getElementById('adminAmount').value) || 0;
            if (!driverName) return;

            const weekId = getSaturdayWeekId();
            if (!window.appState.weeklyRecords[weekId]) window.appState.weeklyRecords[weekId] = {};
            if (!window.appState.weeklyRecords[weekId][driverName]) window.appState.weeklyRecords[weekId][driverName] = { hours: 0, advances: 0, rewards: 0 };
            const rec = window.appState.weeklyRecords[weekId][driverName];

            if (actionType === 'hours') rec.hours = (rec.hours || 0) + amount;
            else if (actionType === 'deduct_hours') rec.hours = Math.max(0, (rec.hours || 0) - amount);
            else if (actionType === 'reward') rec.rewards = (rec.rewards || 0) + amount;
            else if (actionType === 'advance') rec.advances = (rec.advances || 0) + amount;

            db.ref('weeklyRecords').set(window.appState.weeklyRecords);
            document.getElementById('adminAmount').value = "";
            alert("✅ تم تنفيذ العملية بنجاح!");
        };

        function renderWeekSelector() {
            const selector = document.getElementById('weekSelector');
            if (!selector) return;
            let weeks = Object.keys(window.appState.weeklyRecords);
            const thisWeek = getSaturdayWeekId();
            if (!weeks.includes(thisWeek)) weeks.push(thisWeek);
            weeks.sort().reverse();
            selector.innerHTML = weeks.map(w => `<option value="${w}" ${w === window.currentActiveWeek ? 'selected' : ''}>أسبوع: ${w}</option>`).join('');
        }

        window.changeWeekView = function() {
            window.currentActiveWeek = document.getElementById('weekSelector').value;
            renderWeeklyFinancialList();
        };

        window.clearCurrentWeek = function() {
            if (confirm("تصفية هذا الأسبوع؟")) {
                db.ref(`weeklyRecords/${window.currentActiveWeek}`).remove();
                alert("✅ تمت التصفية.");
            }
        };

        function renderWeeklyFinancialList() {
            const container = document.getElementById('driversFinancialList');
            if (!container) return;
            const drivers = getAllDrivers();
            if (drivers.length === 0) { container.innerHTML = `<p style="font-size:11px; text-align:center; color:var(--text-sub);">لا توجد بيانات.</p>`; return; }

            const weekData = window.appState.weeklyRecords[window.currentActiveWeek] || {};
            const weekDays = getWeekDaysList(window.currentActiveWeek);
            const todayStr = new Date().toISOString().split('T')[0];

            container.innerHTML = drivers.map(d => {
                const rec = weekData[d.name] || { hours: 0, advances: 0, rewards: 0, paid: false, days: {} };
                const totalHours = rec.hours || 0;
                const salary = totalHours * HOURLY_RATE;
                const netDue = salary + (rec.rewards || 0) - (rec.advances || 0);

                let isOnDuty = false, activeCarId = null;
                Object.keys(window.appState.activeShifts).forEach(carId => {
                    let val = window.appState.activeShifts[carId];
                    if ((val?.driver || val) === d.name) { isOnDuty = true; activeCarId = carId; }
                });

                let daysTableRows = weekDays.map(day => {
                    const dayData = rec.days && rec.days[day.dateKey];
                    let timeText = '--:--';
                    let statusLabel = day.dateKey < todayStr ? '❌ غياب' : (day.dateKey === todayStr ? '⏳ اليوم' : '⏳ قادم');
                    let color = 'var(--text-sub)';

                    if (dayData?.status === 'absent') {
                        statusLabel = '❌ غائب'; color = 'var(--accent-red)'; timeText = '-';
                    } else if (dayData?.startTime) {
                        timeText = `${formatTime(dayData.startTime)} ➔ ${dayData.endTime ? formatTime(dayData.endTime) : 'قيد العمل'}`;
                        statusLabel = 'حاضر ✅'; color = 'var(--accent-green)';
                    }
                    return `<tr><td><b>${day.name}</b></td><td>${timeText}</td><td style="color:${color}; font-weight:800;">${statusLabel}</td></tr>`;
                }).join('');

                const notesArr = Object.values(window.appState.driverNotes[d.name] || {});
                const notesHtml = notesArr.length > 0 ? notesArr.map(n => `<div class="admin-note-item"><b>${n.sender}:</b> ${n.text}</div>`).join('') : '<p style="color:var(--text-sub); text-align:center;">لا توجد ملاحظات.</p>';

                return `
                    <div class="fin-row">
                        <div class="fin-row-top">
                            <div>
                                <span class="d-name">${d.name}</span>
                                <span class="status-pill ${isOnDuty ? 'status-on' : 'status-off'}">${isOnDuty ? '🟢 في وردية' : '⚪ في استراحة'}</span>
                                <span class="d-car">(${d.car} - ${d.shift})</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:6px;">
                                ${isOnDuty ? `<button class="btn-end-shift" onclick="adminEndShift(${activeCarId}, '${d.name}')">🛑 إنهاء</button>` : ''}
                                <span class="live-timer-badge">⏱️ ${totalHours.toFixed(1)} س</span>
                            </div>
                        </div>

                        <!-- أزرار عرض صور العداد مع وقت التقاطها -->
                        <div style="display:flex; gap:8px; margin-bottom:10px;">
                            <button onclick="openOdometerImage('${d.name}', 'start')" class="btn-submit" style="margin:0; background:rgba(245,158,11,0.2); color:var(--accent-amber); border:1px solid var(--accent-amber); font-size:10px; padding:6px;">📸 صورة عداد البداية</button>
                            <button onclick="openOdometerImage('${d.name}', 'end')" class="btn-submit" style="margin:0; background:rgba(99,102,241,0.2); color:var(--accent-indigo); border:1px solid var(--accent-indigo); font-size:10px; padding:6px;">📸 صورة عداد النهاية</button>
                        </div>

                        <div class="weekly-sched-container">
                            <div class="sched-title">
                                <span>📅 جدول الحضور وأوقات العمل الأسبوعية</span>
                                <button onclick="openAttendanceModal('${d.name}')" class="btn-edit-attendance">✏️ تعديل</button>
                            </div>
                            <table class="sched-table">
                                <thead><tr><th>اليوم والتاريخ</th><th>الوقت</th><th>الحالة</th></tr></thead>
                                <tbody>${daysTableRows}</tbody>
                            </table>
                        </div>

                        <div class="weekly-sched-container">
                            <div class="sched-title" style="color:var(--accent-indigo);">💬 ملاحظات السائق والدردشة</div>
                            <div class="admin-notes-box">${notesHtml}</div>
                            <div style="display:flex; gap:6px;">
                                <input type="text" id="reply_input_${d.name.replace(/\s+/g, '_')}" placeholder="اكتب رداً للسائق..." class="form-control" style="margin-bottom:0;">
                                <button onclick="sendAdminReply('${d.name}')" class="btn-submit" style="width:auto; margin:0; padding:6px 12px; background:var(--accent-indigo); color:#fff;">إرسال</button>
                            </div>
                        </div>

                        <div class="fin-stats-grid">
                            <div class="fin-box"><p class="lbl">ساعات الأسبوع</p><p class="val val-amber">${totalHours.toFixed(1)} س</p></div>
                            <div class="fin-box"><p class="lbl">الأجر</p><p class="val val-green">${Math.round(salary).toLocaleString()} ل.س</p></div>
                            <div class="fin-box"><p class="lbl">المكافآت</p><p class="val val-indigo">${(rec.rewards || 0).toLocaleString()} ل.س</p></div>
                            <div class="fin-box"><p class="lbl">السلف</p><p class="val val-red">${(rec.advances || 0).toLocaleString()} ل.س</p></div>
                            <div class="fin-box"><p class="lbl">الصافي</p><p class="val val-amber">${Math.round(netDue).toLocaleString()} ل.س</p></div>
                        </div>

                        <div class="pay-salary-box">
                            <span style="font-size:10px; font-weight:700; color:${rec.paid ? 'var(--accent-green)' : 'var(--text-sub)'};">${rec.paid ? '✅ تم التقبيض' : '⏳ بانتظار التقبيض'}</span>
                            <button onclick="paySalary('${d.name}', ${Math.round(netDue)})" class="btn-pay ${rec.paid ? 'paid' : ''}">${rec.paid ? 'تم' : '💵 تقبيض الراتب'}</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.openModal = (id) => document.getElementById(id)?.classList.add('active');
        window.closeModal = (id) => document.getElementById(id)?.classList.remove('active');
        window.switchTab = function(tab) {
            document.getElementById('tabFleet').classList.toggle('active', tab === 'fleet');
            document.getElementById('tabSalary').classList.toggle('active', tab === 'salary');
            document.getElementById('tabFleetBtn').classList.toggle('active', tab === 'fleet');
            document.getElementById('tabSalaryBtn').classList.toggle('active', tab === 'salary');
        };
    </script>
</body>
</html>
